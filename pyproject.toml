[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-evaluation-preview"
version = "0.1.0"
description = "Partial code preview: evaluation records, paired statistics, and reporting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
readme = "README.md"

[project.scripts]
evidence-preview = "evidence_preview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_preview = ["examples/*.json"]
